[package]
name = "gemma-wgpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Gemma-4 E2B inference engine in Rust on wgpu: every kernel hand-written WGSL, no inference library."
license = "MIT"

[lib]
name = "gemma_wgpu"
path = "src/lib.rs"

[[bin]]
name = "gemma-wgpu"
path = "src/main.rs"

[dependencies]
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
fancy-regex = "0.19"
clap = { version = "4", features = ["derive"] }
ureq = "3"
thiserror = "2"

[profile.release]
opt-level = 3
debug = 1

[profile.test]
opt-level = 2
